<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Arr Command Center</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/login.css" />
  <link rel="icon" type="image/png" href="/icons/home-icon.png" />
</head>
<body class="login-body">
  <div id="hive-bg"></div>
  <div class="login-card">
    <div class="login-face">
      <div class="login-logo-chip"><img class="login-logo" src="/icons/home-icon.png" alt="" /></div>
      <h1>Arr Command Center</h1>
      <p class="dim">Sign in with your Plex account to continue.</p>
      <button id="plex-btn" class="btn primary login-btn">
        <span class="plex-mark"></span> Sign in with Plex
      </button>
      <div id="login-status" class="login-status"></div>
    </div>
  </div>
  <script src="/login.js"></script>
</body>
</html>
