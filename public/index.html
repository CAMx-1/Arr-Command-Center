<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f1117" />
  <title>Arr Command Center</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/png" sizes="any" href="/icons/favicon.png" />
  <!-- PWA / installability + iOS web push (requires Add to Home Screen on iOS 16.4+) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Command Center" />
</head>
<body>
  <div id="app">
    <div id="hive-bg" aria-hidden="true"></div>
    <aside id="sidebar">
      <div id="hive"></div>
    </aside>

    <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">☰</button>

    <main id="main">
      <header id="topbar">
        <h1 id="page-title">Overview</h1>
        <div class="topbar-right">
          <button id="search-btn" class="topbar-icon-btn" title="Search (press /)" aria-label="Search">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </button>
          <div id="notif-wrap">
            <button id="notif-btn" class="topbar-icon-btn" title="Notifications" aria-label="Notifications">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span id="notif-badge" class="notif-badge hidden">0</span>
            </button>
            <div id="notif-panel" class="notif-panel hidden"></div>
          </div>
          <div id="topbar-actions"></div>
        </div>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <div id="toast-container"></div>
  <div id="modal-root"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
